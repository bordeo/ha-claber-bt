name: HACS Action

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Topics must be set on the GitHub repo (homeassistant, hacs, integration).
          # The cloud-agent token cannot edit repository topics; ignore until set in the UI.
          ignore: topics
